<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Messages"><meta name="mobile-web-app-capable" content="yes"><meta name="description" content="Transport Messages — приложение для переписок"><title>Transport Messages</title>
  <link rel="icon" href="assets/icon-round-192-v2.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-apple-180-v2.png"><link rel="stylesheet" href="styles.css"><style>.preview-island{display:none!important}.show-island:not(.has-native-safe-area) .app-shell{padding-top:env(safe-area-inset-top)!important}</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-top"><div class="top-tools"><button class="top-tool top-tool-icon admin-entry" id="topAdminBtn" title="Вход администратора" aria-label="Вход администратора"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="4"/><path d="m11 12 8 8m-4-4 3-3m-6 0 3-3"/></svg></button><button class="top-tool" id="topSettingsBtn" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10m-7 5h4"/></svg></button><button class="top-tool" id="topAuthBtn" title="Профиль и авторизация" aria-label="Профиль и авторизация"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button><button class="top-tool top-tool-icon" id="newChatBtn" title="Новый чат" aria-label="Новый чат"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13v7H4V4h7m4-1 6 6m-12 6 1-5L19 1l4 4-9 9z"/></svg></button></div></div>
      <div class="sidebar-heading"><h1>Сообщения</h1><span class="subtle" id="chatCount">6 чатов</span></div>
      <label class="search"><span>⌕</span><input id="searchInput" aria-label="Поиск переписок" placeholder="Поиск" autocomplete="off"></label>
      <div class="chat-list" id="chatList">
        <button class="chat-item active" data-chat="7000"><div class="avatar trolley">7000</div><div class="chat-preview"><div class="chat-line"><b>7000</b><time>сейчас</time></div><p>Напишите сообщение</p></div></button>
        <button class="chat-item" data-chat="7001"><div class="avatar bus">7001</div><div class="chat-preview"><div class="chat-line"><b>7001</b><time>сейчас</time></div><p>Напишите сообщение</p></div></button>
        <button class="chat-item" data-chat="mom"><div class="avatar mom">М</div><div class="chat-preview"><div class="chat-line"><b>Мама</b><time>09:24</time></div><p>Не забудь купить хлеб 🙂</p></div></button>
        <button class="chat-item" data-chat="dad"><div class="avatar dad">П</div><div class="chat-preview"><div class="chat-line"><b>Папа</b><time>08:51</time></div><p>Во сколько будешь дома?</p></div></button>
        <button class="chat-item" data-chat="nastya"><div class="avatar nastya">Н</div><div class="chat-preview"><div class="chat-line"><b>Настя</b><time>Вчера</time></div><p>Хорошо, тогда до встречи!</p></div></button>
        <button class="chat-item" data-chat="friends"><div class="avatar friends">Д</div><div class="chat-preview"><div class="chat-line"><b>Друзья</b><time>Вчера</time></div><p>Кто сегодня гуляет?</p></div></button>
      </div>
      <div class="sidebar-bottom"><button class="nav-link selected" data-view="messages"><span>▤</span> Сообщения</button><button class="nav-link" data-view="settings"><span>⚙</span> Настройки</button><div class="profile"><div class="profile-avatar">TM</div><div><b id="profileName">Пользователь</b><small id="licenseStatus">Доступ активен</small></div><button class="dots" id="profileMenu" aria-label="Профиль">•••</button></div></div>
    </aside>
    <main class="main-panel">
      <header class="chat-header">
        <button class="mobile-back glass-button" id="mobileBack" aria-label="Назад к сообщениям"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
        <div class="contact-heading"><div class="avatar small" id="headerAvatar"></div><button class="header-title" id="contactDetails" aria-label="Информация о контакте"><h2 id="headerName">7000</h2><span aria-hidden="true">›</span></button><p id="headerSubtitle" hidden></p></div>
        <div class="header-actions"><button class="icon-btn" id="infoBtn" title="Информация" aria-label="Информация">ⓘ</button><button class="icon-btn" id="clearChatBtn" title="Очистить историю" aria-label="Очистить историю"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 10v7m4-7v7"/></svg></button></div>
      </header>
      <section class="messages" id="messages" aria-live="polite"></section>
      <div class="composer-wrap"><div class="composer-hint hidden" id="composerHint"></div><form class="composer" id="messageForm"><button type="button" class="plus-btn" id="attachBtn" title="Подсказки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button><textarea rows="1" id="messageInput" aria-label="Текст сообщения" placeholder="Текстовое сообщение · SMS" autocomplete="off" maxlength="500"></textarea><button class="send-btn" type="submit" aria-label="Отправить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></section></div>
  <div class="license-gate hidden" id="licenseGate" role="dialog" aria-modal="true"><div class="license-gate-card"><div class="gate-mark">TM</div><h2 id="gateTitle">Доступ к приложению</h2><p id="gateText">Для продолжения введите ключ владельца.</p><button class="primary-btn full" id="gateAction">Ввести ключ</button><button class="secondary-btn full" id="gateAdminAction">Вход администратора</button><p class="gate-footnote">Ключ вводится один раз на этом устройстве.</p></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
