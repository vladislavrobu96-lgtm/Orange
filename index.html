
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Messages">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Transport Messages — приложение для переписок">
  <title>Transport Messages</title>

  <link rel="icon" href="assets/icon-round-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="top-tools">
          <button class="top-tool top-tool-icon admin-entry" id="scanBtn" title="Сканировать билет" aria-label="Сканировать билет">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2m8-16h2a2 2 0 0 1 2 2v2m-4 12h2a2 2 0 0 0 2-2v-2"/>
              <rect x="7" y="8" width="10" height="8" rx="2"/>
              <circle cx="12" cy="12" r="1.6"/>
            </svg>
          </button>

          <button class="top-tool" id="topSettingsBtn" title="Настройки" aria-label="Настройки">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M7 12h10m-7 5h4"/>
            </svg>
          </button>

          <button class="top-tool" id="topAuthBtn" title="Профиль и авторизация" aria-label="Профиль и авторизация">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
            </svg>
          </button>

          <button class="top-tool top-tool-icon" id="newChatBtn" title="Новый чат" aria-label="Новый чат">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 13v7H4V4h7m4-1 6 6m-12 6 1-5L19 1l4 4-9 9z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-heading">
        <h1>Сообщения</h1>
        <span class="subtle" id="chatCount">20 чатов</span>
      </div>

      <label class="search">
        <span>⌕</span>
        <input id="searchInput" aria-label="Поиск переписок" placeholder="Поиск" autocomplete="off">
      </label>

      <div class="chat-list" id="chatList" aria-label="Переписки"></div>

      <div class="sidebar-bottom">
        <button class="nav-link selected" data-view="messages">
          <span>▤</span> Сообщения
        </button>
        <button class="nav-link" data-view="settings">
          <span>⚙</span> Настройки
        </button>

        <div class="profile">
          <div class="profile-avatar">TM</div>
          <div>
            <b id="profileName">Пользователь</b>
            <small id="licenseStatus">Доступ активен</small>
          </div>
          <button class="dots" id="profileMenu" aria-label="Профиль">•••</button>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="chat-header">
        <button class="mobile-back glass-button" id="mobileBack" aria-label="Назад к сообщениям">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 4-8 8 8 8"/>
          </svg>
        </button>

        <div class="contact-heading">
          <div class="avatar small" id="headerAvatar"></div>

          <button class="header-title" id="contactDetails" aria-label="Информация о контакте">
            <h2 id="headerName">7000</h2>
            <svg class="chev" viewBox="0 0 7 12" aria-hidden="true">
              <path d="M1 1l5 5-5 5"/>
            </svg>
          </button>

          <p id="headerSubtitle" hidden></p>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="infoBtn" title="Информация" aria-label="Информация">ⓘ</button>

          <button class="icon-btn" id="clearChatBtn" title="Очистить историю" aria-label="Очистить историю">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 10v7m4-7v7"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <div class="composer-wrap">
        <div class="composer-hint hidden" id="composerHint"></div>

        <form class="composer" id="messageForm">
          <button type="button" class="plus-btn" id="attachBtn" title="Подсказки">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v16M4 12h16"/>
            </svg>
          </button>

          <textarea
            rows="1"
            id="messageInput"
            aria-label="Текст сообщения"
            placeholder="Текстовое сообщение · SMS"
            autocomplete="off"
            enterkeyhint="send"
            maxlength="500"
          ></textarea>

          <button class="send-btn" type="submit" aria-label="Отправить">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5m-6 6 6 6"/>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <div class="license-gate hidden" id="licenseGate" role="dialog" aria-modal="true">
    <div class="license-gate-card">
      <div class="gate-mark">TM</div>
      <h2 id="gateTitle">Доступ к приложению</h2>
      <p id="gateText">Для продолжения введите ключ владельца.</p>
      <button class="primary-btn full" id="gateAction">Ввести ключ</button>
      <p class="gate-footnote">Ключ вводится один раз на этом устройстве.</p>
    </div>
  </div>

  <div class="scan-overlay hidden" id="scanOverlay" role="dialog" aria-modal="true" aria-label="Сканирование билета">
    <video id="scanVideo" playsinline muted autoplay></video>

    <button class="scan-close icon-btn" id="scanClose" aria-label="Закрыть сканер">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18"/>
      </svg>
    </button>

    <div class="scan-frame" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <p class="scan-status" id="scanStatus">Наведите камеру на стикер с кодом</p>

    <div class="scan-manual hidden" id="scanManual">
      <p>Не получилось распознать? Введите вручную.</p>

      <select class="field" id="scanManualChat" aria-label="Чат">
        <option value="7000">7000</option>
        <option value="7001">7001</option>
      </select>

      <input
        class="field"
        id="scanManualCode"
        maxlength="4"
        inputmode="numeric"
        placeholder="Номер борта, напр. 3956"
      >

      <button class="primary-btn full" id="scanManualSubmit">Отправить</button>
    </div>

    <button class="scan-shutter" id="scanShutter" aria-label="Сканировать"></button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
