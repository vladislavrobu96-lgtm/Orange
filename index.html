<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Messages"><meta name="mobile-web-app-capable" content="yes"><meta name="description" content="Transport Messages — приложение для переписок"><title>Transport Messages</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-top"><div class="top-tools"><button class="top-tool top-tool-icon admin-entry" id="topAdminBtn" title="Вход администратора" aria-label="Вход администратора">⚿</button><button class="top-tool" id="topSettingsBtn" title="Настройки">⚙ <span>Настройки</span></button><button class="top-tool" id="topAuthBtn" title="Авторизация">♙ <span>Авторизация</span></button><button class="top-tool top-tool-icon" id="newChatBtn" title="Новый чат" aria-label="Новый чат">＋</button></div></div>
      <div class="sidebar-heading"><h1>Сообщения</h1><span class="subtle" id="chatCount">6 чатов</span></div>
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="Поиск" autocomplete="off"></label>
      <div class="chat-list" id="chatList">
        <button class="chat-item active" data-chat="7000"><div class="avatar trolley">7000</div><div class="chat-preview"><div class="chat-line"><b>7000</b><time>сейчас</time></div><p>Троллейбусы · Напишите код маршрута</p></div></button>
        <button class="chat-item" data-chat="7001"><div class="avatar bus">7001</div><div class="chat-preview"><div class="chat-line"><b>7001</b><time>сейчас</time></div><p>Автобусы · Напишите код маршрута</p></div></button>
        <button class="chat-item" data-chat="mom"><div class="avatar mom">М</div><div class="chat-preview"><div class="chat-line"><b>Мама</b><time>09:24</time></div><p>Не забудь купить хлеб 🙂</p></div></button>
        <button class="chat-item" data-chat="dad"><div class="avatar dad">П</div><div class="chat-preview"><div class="chat-line"><b>Папа</b><time>08:51</time></div><p>Во сколько будешь дома?</p></div></button>
        <button class="chat-item" data-chat="nastya"><div class="avatar nastya">Н</div><div class="chat-preview"><div class="chat-line"><b>Настя</b><time>Вчера</time></div><p>Хорошо, тогда до встречи!</p></div></button>
        <button class="chat-item" data-chat="friends"><div class="avatar friends">Д</div><div class="chat-preview"><div class="chat-line"><b>Друзья</b><time>Вчера</time></div><p>Кто сегодня гуляет?</p></div></button>
      </div>
      <div class="sidebar-bottom"><button class="nav-link selected" data-view="messages"><span>▤</span> Сообщения</button><button class="nav-link" data-view="settings"><span>⚙</span> Настройки</button><div class="profile"><div class="profile-avatar">TM</div><div><b id="profileName">Пользователь</b><small id="licenseStatus">Доступ активен</small></div><button class="dots" id="profileMenu" aria-label="Профиль">•••</button></div></div>
    </aside>
    <main class="main-panel">
      <header class="chat-header"><button class="mobile-back" id="mobileBack">‹</button><div class="avatar small trolley" id="headerAvatar">7000</div><div class="header-title"><h2 id="headerName">7000</h2><p id="headerSubtitle">Троллейбусы</p></div><div class="header-actions"><button class="icon-btn" id="infoBtn" title="Информация">ⓘ</button><button class="icon-btn" id="clearChatBtn" title="Очистить историю">⌫</button></div></header>
      <section class="messages" id="messages" aria-live="polite"></section>
      <div class="composer-wrap"><div class="composer-hint hidden" id="composerHint"></div><form class="composer" id="messageForm"><button type="button" class="plus-btn" id="attachBtn" title="Подсказки">＋</button><input id="messageInput" placeholder="Сообщение" autocomplete="off" maxlength="500"><button class="send-btn" type="submit" aria-label="Отправить">↑</button></form></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></section></div>
  <div class="license-gate hidden" id="licenseGate" role="dialog" aria-modal="true"><div class="license-gate-card"><div class="gate-mark">TM</div><h2 id="gateTitle">Доступ к приложению</h2><p id="gateText">Для продолжения активируй лицензионный ключ.</p><button class="primary-btn full" id="gateAction">Ввести ключ</button><button class="secondary-btn full" id="gateAdminAction">Вход администратора</button><p class="gate-footnote">Если срок лицензии закончился, запроси продление у администратора.</p></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
